<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quests: Curse of Strahd</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Curse of Strahd</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">Session Log</a></li>
        <li><a href="npcs.html" data-i18n="nav.npcs">NPCs</a></li>
        <li><a href="locations.html" data-i18n="nav.locations">Locations</a></li>
        <li><a href="goals.html" data-i18n="nav.quests">Quests</a></li>
        <li><a href="factions.html" data-i18n="nav.factions">Factions</a></li>
      </ul>
      <div class="nav-right">
        <button class="lang-toggle" title="Byt till svenska">SV</button>
        <button class="nav-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title" data-i18n="goals.title">Quest Board</h1>
    </div>

    <div class="content-area">
      <div class="goals-board" id="goals-board"></div>
    </div>
  </main>

  <footer class="main-footer" data-i18n="home.footer">A campaign chronicle from the Domains of Dread, Barovia</footer>
  <button class="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
    function renderGoals() {
      const board = document.getElementById('goals-board');
      const active = CAMPAIGN.goals.filter(g => g.status === 'active').sort((a, b) => b.session - a.session);
      const completed = CAMPAIGN.goals.filter(g => g.status === 'completed').sort((a, b) => b.session - a.session);
      const fromLabel = t('goals.from');

      function renderSection(titleKey, icon, goals, isCompleted) {
        let html = `<div><div class="goals-section-title">${icon} ${t(titleKey)}</div><div class="quest-list">`;
        if (!goals.length) html += emptyState('empty.quests');
        goals.forEach(g => {
          const cls = isCompleted ? ' completed' : '';
          const qi = isCompleted ? '☑' : '◇';
          const text = getGoalText(g.id) || g.text;
          html += `<div class="quest-card${cls} fade-in"><div class="quest-icon">${qi}</div><div class="quest-content"><div class="quest-text">${text}</div><div class="quest-meta">${fromLabel} ${g.session}</div></div></div>`;
        });
        return html + `</div></div>`;
      }

      board.innerHTML =
        renderSection('goals.active', '⚔', active, false) +
        renderSection('goals.completed', '📜', completed, true);
    }

    campaignReady.then(() => {
      renderGoals();
      window.addEventListener('langchange', renderGoals);
    });
  </script>
</body>
</html>
