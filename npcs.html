<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC Directory: Curse of Strahd</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Curse of Strahd</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">Session Log</a></li>
        <li><a href="npcs.html" data-i18n="nav.npcs">NPCs</a></li>
        <li><a href="locations.html" data-i18n="nav.locations">Locations</a></li>
        <li><a href="goals.html" data-i18n="nav.quests">Quests</a></li>
        <li><a href="factions.html" data-i18n="nav.factions">Factions</a></li>
      </ul>
      <div class="nav-right">
        <button class="lang-toggle" title="Byt till svenska">SV</button>
        <button class="nav-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title" data-i18n="npcs.title">NPC Directory</h1>
      <p class="page-subtitle" data-i18n="npcs.subtitle">Souls we have encountered on our journey</p>
    </div>

    <div class="content-area wide">
      <div class="search-bar">
        <input type="text" id="npc-search" class="search-input" data-i18n-placeholder="npcs.search" placeholder="Search by name or location...">
      </div>
      <div class="npc-grid" id="npc-grid"></div>
    </div>
  </main>

  <footer class="main-footer" data-i18n="home.footer">A campaign chronicle from the Domains of Dread, Barovia</footer>
  <button class="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
    function renderNPCs() {
      const grid = document.getElementById('npc-grid');
      grid.innerHTML = CAMPAIGN.npcs.length ? '' : emptyState('empty.npcs');

      CAMPAIGN.npcs.forEach(npc => {
        const card = document.createElement('div');
        card.className = 'npc-card fade-in';
        card.dataset.name = npc.name;
        card.dataset.locations = npc.locations.join(' ');
        card.dataset.firstSession = npc.firstSession;
        const npcSessions = (npc.sessions && npc.sessions.length ? npc.sessions : [npc.firstSession]);
        card.dataset.sessions = npcSessions.join(',');

        const initials = npc.name.replace(/["]/g, '').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

        card.innerHTML = `
          <div class="npc-portrait">
            <img src="${npc.image}" alt="${npc.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="npc-portrait-placeholder" style="display:none; position:absolute; inset:0; align-items:center; justify-content:center;">${initials}</div>
          </div>
          <div class="npc-info">
            <div class="npc-name">${npc.name}</div>
            <div class="npc-detail">
              <span class="npc-detail-label">${t('npcs.overview')}</span>
              ${getNpcAppearance(npc.name) || npc.appearance}
            </div>
            <div class="npc-detail" style="margin-top: 0.6rem;">
              <span class="npc-detail-label">${t('npcs.locations')}</span>
              <div class="npc-locations">
                ${npc.locations.map(l => `<span class="npc-tag">${l}</span>`).join('')}
              </div>
            </div>
            <div class="npc-session-badge">${t('npcs.firstsession')} ${npc.firstSession}</div>
            ${npcSessions.length > 1 ? `<div class="npc-locations" style="margin-top:0.4rem;">${npcSessions.map(s => `<span class="npc-tag">S${s}</span>`).join('')}</div>` : ''}
          </div>`;

        grid.appendChild(card);
      });
    }

    campaignReady.then(() => {
      renderSessionFilters(document.querySelector('.search-bar'), 'data-filter-session');
      renderNPCs();
      window.addEventListener('langchange', renderNPCs);
    });
  </script>
</body>
</html>
