<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locations: Curse of Strahd</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Barovia</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">Session Log</a></li>
        <li><a href="npcs.html" data-i18n="nav.npcs">NPCs</a></li>
        <li><a href="locations.html" data-i18n="nav.locations">Locations</a></li>
        <li><a href="goals.html" data-i18n="nav.quests">Quests</a></li>
        <li><a href="factions.html" data-i18n="nav.factions">Factions</a></li>
      </ul>
      <div class="nav-right">
        <button class="lang-toggle" title="Byt till svenska">SV</button>
        <button class="nav-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title" data-i18n="loc.title">Discovered Locations</h1>
      <p class="page-subtitle" data-i18n="loc.subtitle">Places marked upon our map of Barovia</p>
    </div>

    <div class="content-area wide">
      <div class="search-bar">
        <input type="text" id="location-search" class="search-input" data-i18n-placeholder="loc.search" placeholder="Search locations...">
      </div>
      <div class="location-grid" id="location-grid"></div>
    </div>
  </main>

  <footer class="main-footer" data-i18n="home.footer">A campaign chronicle from the Domains of Dread, Barovia</footer>
  <button class="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
    function renderLocations() {
      const grid = document.getElementById('location-grid');
      grid.innerHTML = CAMPAIGN.locations.length ? '' : emptyState('empty.locations');
      CAMPAIGN.locations.forEach(loc => {
        const events = getLocationEvents(loc.name) || loc.events;
        const card = document.createElement('div');
        card.className = 'location-card fade-in';
        card.dataset.sessions = loc.sessions.join(',');
        card.innerHTML = `
          <div class="location-card-header">
            <div class="location-name">${loc.name}</div>
            <div class="location-sessions">
              ${loc.sessions.map(s => `<span class="location-session-tag">S${s}</span>`).join('')}
            </div>
          </div>
          <ul class="location-events">
            ${events.map(e => `<li>${e}</li>`).join('')}
          </ul>`;
        grid.appendChild(card);
      });
    }
    campaignReady.then(() => {
      renderSessionFilters(document.querySelector('.search-bar'), 'data-filter-loc-session');
      renderLocations();
      window.addEventListener('langchange', renderLocations);
    });
  </script>
</body>
</html>
