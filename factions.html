<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factions: Curse of Strahd</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Curse of Strahd</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">Session Log</a></li>
        <li><a href="npcs.html" data-i18n="nav.npcs">NPCs</a></li>
        <li><a href="locations.html" data-i18n="nav.locations">Locations</a></li>
        <li><a href="goals.html" data-i18n="nav.quests">Quests</a></li>
        <li><a href="factions.html" data-i18n="nav.factions">Factions</a></li>
      </ul>
      <div class="nav-right">
        <button class="lang-toggle" title="Byt till svenska">SV</button>
        <button class="nav-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title" data-i18n="factions.title">Factions</h1>
      <p class="page-subtitle" data-i18n="factions.subtitle">Powers that stir in the shadow of Castle Ravenloft</p>
    </div>

    <div class="content-area wide">
      <div class="faction-grid" id="faction-grid"></div>
    </div>
  </main>

  <footer class="main-footer" data-i18n="home.footer">A campaign chronicle from the Domains of Dread, Barovia</footer>
  <button class="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="assets/js/data.js?v=2"></script>
  <script src="assets/js/i18n.js?v=2"></script>
  <script src="assets/js/app.js?v=2"></script>
  <script>
    function renderFactions() {
      const grid = document.getElementById('faction-grid');
      grid.innerHTML = CAMPAIGN.factions.length ? '' : emptyState('empty.factions');
      const lang = getLang();
      const contactsLabel = t('factions.contacts');

      CAMPAIGN.factions.forEach(f => {
        const desc = lang === 'sv' ? f.descriptionSv : f.description;
        const card = document.createElement('div');
        card.className = 'faction-card fade-in';
        card.innerHTML = `
          <div class="faction-header">
            <span class="faction-icon">${f.icon}</span>
            <h2 class="faction-name">${f.name}</h2>
          </div>
          <p class="faction-description">${desc}</p>
          ${f.contacts.length ? `
          <div class="faction-section">
            <div class="faction-label">${contactsLabel}</div>
            <div class="faction-tags">
              ${f.contacts.map(c => `<span class="faction-contact-tag">${c}</span>`).join('')}
            </div>
          </div>` : ''}`;
        grid.appendChild(card);
      });
    }

    campaignReady.then(() => {
      renderFactions();
      window.addEventListener('langchange', renderFactions);
    });
  </script>
</body>
</html>
